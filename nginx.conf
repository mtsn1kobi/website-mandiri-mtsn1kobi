server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Handle static files directly
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    # Cache static assets
    location /_next/static {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets-driving {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
